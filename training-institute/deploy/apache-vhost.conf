# Apache virtual host for RTTI (Ubuntu: /etc/apache2/sites-available/rtti.conf)
#   sudo a2enmod rewrite headers ssl && sudo a2ensite rtti && sudo systemctl reload apache2
<VirtualHost *:80>
    ServerName rtti.example.org
    # Point at the public/ folder ONLY — the rest of the project must not be web-accessible.
    DocumentRoot /var/www/rtti/training-institute/public

    <Directory /var/www/rtti/training-institute/public>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>

    # Uploaded files are stored in storage/ (outside public/) and served by the app after permission checks.
    ErrorLog ${APACHE_LOG_DIR}/rtti-error.log
    CustomLog ${APACHE_LOG_DIR}/rtti-access.log combined
</VirtualHost>
# After DNS points here:  sudo certbot --apache -d rtti.example.org   (free HTTPS from Let's Encrypt)

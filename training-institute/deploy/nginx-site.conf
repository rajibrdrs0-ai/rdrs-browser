# Nginx + PHP-FPM site for RTTI (Ubuntu: /etc/nginx/sites-available/rtti)
#   sudo ln -s /etc/nginx/sites-available/rtti /etc/nginx/sites-enabled/ && sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80;
    server_name rtti.example.org;
    root /var/www/rtti/training-institute/public;   # public/ only
    index index.php;
    charset utf-8;
    client_max_body_size 12M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Never execute anything uploaded into public/uploads
    location ~* ^/uploads/.*\.(php|phtml|phar|pl|py|cgi|sh)$ { deny all; }
    location ~ /\. { deny all; }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;   # adjust to your PHP version
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;
    }

    location ~* \.(css|js|woff2?|png|jpe?g|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
# HTTPS:  sudo certbot --nginx -d rtti.example.org

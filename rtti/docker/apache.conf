<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/rtti/public
    <Directory /var/www/rtti>
        AllowOverride None
    </Directory>
    <Directory /var/www/rtti/public>
        AllowOverride All
        Require all granted
    </Directory>
    # Never serve application folders
    <DirectoryMatch "^/var/www/rtti/(app|config|database|storage|docs|docker)">
        Require all denied
    </DirectoryMatch>
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

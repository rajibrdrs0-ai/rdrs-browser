# RTTI – start with:  docker compose up -d   then open http://localhost:8080
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-time-zone=+06:00
    environment:
      MYSQL_DATABASE: ${DB_NAME:-rtti_training_management}
      MYSQL_USER: ${DB_USER:-rtti}
      MYSQL_PASSWORD: ${DB_PASS:-change_me_db}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:-change_me_root}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASS:-change_me_root}"]
      interval: 10s
      timeout: 5s
      retries: 20

  app:
    build: .
    image: rtti-app:1.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-rtti_training_management}
      DB_USER: ${DB_USER:-rtti}
      DB_PASS: ${DB_PASS:-change_me_db}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@12345}
      LOAD_DEMO_DATA: ${LOAD_DEMO_DATA:-0}
      APP_DEBUG: ${APP_DEBUG:-0}
    volumes:
      - rtti_storage:/var/www/rtti/storage

  # Optional web database tool:  docker compose --profile tools up -d  → http://localhost:8081
  phpmyadmin:
    image: phpmyadmin:5
    profiles: ["tools"]
    depends_on: [db]
    ports:
      - "${PMA_PORT:-8081}:80"
    environment:
      PMA_HOST: db

volumes:
  db_data:
  rtti_storage:
